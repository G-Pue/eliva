  "h_start": "Ausgangspunkt",
  "start_p": "An deutschen Schulen lernen immer mehr Kinder und Jugendliche, die dem Unterricht sprachlich nicht oder nur teilweise folgen können. Für sie bedeutet das weniger Erfolgserlebnisse, geringere Lernfortschritte und Erfahrungen des Ausgeschlossenseins. Das Fach Kunst bietet hier besondere Möglichkeiten: Bildnerisches Arbeiten ist an Wahrnehmung, Material und körperliches Handeln gebunden und lässt sich daher weitgehend ohne Worte vermitteln. Es eröffnet zugleich Wege des Ausdrucks jenseits der Verbalsprache und stärkt Teilhabe und Selbstwirksamkeit.",
  "h_gap": "Forschungslücke",
  "gap_p": "Gesten und Zeigehandlungen sind in der Linguistik, den Kognitionswissenschaften und der Pädagogik gut untersucht, aber fast immer in Verbindung mit Sprache oder außerhalb künstlerischer Lehr-Lern-Situationen. Für den Kunstunterricht liegen einzelne Beobachtungen vor, jedoch keine Systematik, wie Lehrkräfte bildnerische Prozesse und Entscheidungen vermitteln können, wenn Sprache kaum zur Verfügung steht.",
  "methode_p": "Das Projekt läuft seit 2024 in mehreren Strängen. In der ersten Phase entwickelten Lehramtsstudierende der PH Ludwigsburg in einem Seminar Kunstunterricht für Vorbereitungsklassen, führten ihn an Schulen der Primar- und Sekundarstufe durch und videografierten ihn. Die Auswertung folgt der konstruktivistischen Grounded Theory nach Charmaz: Die Videos werden mit zwei bis drei Kameraperspektiven aufgenommen, multimodal annotiert und in iterativen Durchgängen kodiert; Schlüsselszenen werden transkribiert, Kategorien am Material entwickelt, mit bestehenden Konzepten aus Linguistik und Pädagogik abgeglichen und an weiteren Einheiten geprüft.",
  "ergebnis_p": "Aus dem Material wurde eine Typologie non-verbaler Zeigearten entwickelt, die beschreibt, mit welchen körperlichen Mitteln Lehrkräfte Werkinhalt, Werktechnik und Gestaltung vermitteln. Sie knüpft an Konzepte der Gesten- und Zeigeforschung an, weist aber Merkmale auf, die spezifisch für den Kunstunterricht sind. Daneben zeichnen sich erste Erkenntnisse zu den Beziehungen der Zeigearten untereinander sowie zu Gelingensbedingungen und Gefahren non-verbaler Vermittlung ab. Die Ergebnisse werden in einem Beitrag zur Veröffentlichung vorbereitet; Definitionen und Beispiele folgen mit dem Erscheinen des Artikels.",
  "h_plan": "Geplant: Lehrkräftefortbildungen zu non-verbalen Vermittlungsformen im Kunstunterricht",

 "en": {
  "inst": "Ludwigsburg University of Education · Art Education",

  "lede": "Art is an expression of our sensory connection with the world. We experience and shape it with our whole body. Teaching and learning in the field of art must therefore relate to our body and can only happen with it and through it. The ELIVA project is dedicated to researching and developing body-related forms of teaching and learning in school and out-of-school contexts. Its aim is to direct the art-educational gaze towards the human being as an embodied being, and to rethink art teaching and art education from this perspective.",

  "methode_p": "The project has been running since 2024 in several strands. In the first phase, student teachers at Ludwigsburg University of Education developed art lessons for preparatory classes in a seminar, taught them at primary and lower secondary schools and recorded them on video. The analysis follows constructivist grounded theory after Charmaz: the videos are recorded from two to three camera perspectives, annotated multimodally and coded in iterative rounds; key scenes are transcribed, categories are developed from the material, compared with existing concepts from linguistics and education, and tested on further lessons.",

  "lede": "El arte es expresión de nuestra conexión sensorial con el mundo. Lo experimentamos y lo creamos con todo nuestro cuerpo. Enseñar y aprender en el campo del arte debe, por tanto, referirse a nuestro cuerpo y solo puede suceder con él y a través de él. El proyecto ELIVA se dedica a investigar y desarrollar formas corporales de enseñanza y aprendizaje en contextos escolares y extraescolares. Su objetivo es dirigir la mirada de la pedagogía del arte hacia el ser humano como ser corporal y repensar desde esta perspectiva la clase de arte y la mediación artística.",

  "h_frage": "Preguntas de investigación",
  "frage_p": "¿Qué ayudas no verbales son posibles en la clase de arte para poner en marcha procesos plásticos de pensamiento, decisión y acción? ¿Y qué dificultades específicas de la asignatura surgen en las distintas formas de enseñanza no verbal?",

  "h_start": "Punto de partida",
  "start_p": "En las escuelas alemanas aprenden cada vez más niños, niñas y jóvenes que no pueden seguir las clases en alemán, o solo en parte. Para ellos esto significa menos experiencias de éxito, menores avances en el aprendizaje y experiencias de exclusión. La asignatura de arte ofrece aquí posibilidades especiales: el trabajo plástico está ligado a la percepción, al material y a la acción corporal y, por tanto, puede enseñarse en gran medida sin palabras. Al mismo tiempo abre vías de expresión más allá del lenguaje verbal y fortalece la participación y la autoeficacia.",
  "h_gap": "Laguna de investigación",
  "gap_p": "Los gestos y los actos de mostrar están bien estudiados en la lingüística, las ciencias cognitivas y la pedagogía, pero casi siempre en relación con el habla o fuera de situaciones artísticas de enseñanza y aprendizaje. Para la clase de arte existen observaciones aisladas, pero ninguna sistematización de cómo el profesorado puede transmitir procesos y decisiones plásticas cuando apenas se dispone de lenguaje.",
  "methode_p": "El proyecto se desarrolla desde 2024 en varias líneas. En la primera fase, estudiantes de magisterio de la Facultad de Educación de Ludwigsburg diseñaron en un seminario clases de arte para clases preparatorias, las impartieron en escuelas de primaria y secundaria y las grabaron en vídeo. El análisis sigue la teoría fundamentada constructivista según Charmaz: los vídeos se graban desde dos o tres perspectivas de cámara, se anotan de forma multimodal y se codifican en rondas iterativas; se transcriben escenas clave, las categorías se desarrollan a partir del material, se contrastan con conceptos existentes de la lingüística y la pedagogía y se comprueban en nuevas sesiones.",
  "ergebnis_p": "A partir del material se desarrolló una tipología de formas no verbales de mostrar que describe con qué medios corporales el profesorado transmite el contenido, la técnica y la configuración de la obra. Se apoya en conceptos de la investigación sobre gestos y sobre el mostrar, pero presenta rasgos específicos de la clase de arte. Además, se perfilan primeros resultados sobre las relaciones entre las formas de mostrar y sobre las condiciones de éxito y los riesgos de la enseñanza no verbal. Los resultados se están preparando para su publicación; las definiciones y los ejemplos se añadirán cuando aparezca el artículo.",

(function(){
  var cur='de';
  function apply(l){
    cur=l;var d=T[l];
    document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(k in d)el.innerHTML=d[k]});
    document.documentElement.lang=l;
    document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===l))});
    try{localStorage.setItem('eliva-lang',l)}catch(e){}
    mark();
  }
  document.querySelectorAll('.langs button').forEach(function(b){b.addEventListener('click',function(){apply(b.dataset.lang)})});
  var start='de';
  try{var saved=localStorage.getItem('eliva-lang');if(saved&&T[saved])start=saved;else{var nav=(navigator.language||'').slice(0,2);if(T[nav])start=nav}}catch(e){}

  var links=[].slice.call(document.querySelectorAll('nav.side a'));
  var secs=links.map(function(a){return document.querySelector(a.getAttribute('href'))}).filter(Boolean);
  function mark(){
    var y=window.scrollY+140,c=secs[0];
    secs.forEach(function(s){if(s.offsetTop<=y)c=s});
    links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+c.id)});
  }
  window.addEventListener('scroll',mark,{passive:true});
  document.querySelectorAll('.copy').forEach(function(b){
    b.addEventListener('click',function(){
      var t=document.querySelector(b.dataset.copy),txt=t.textContent;
      function done(){b.textContent=T[cur].copied;setTimeout(function(){b.textContent=T[cur].copy},1500)}
      function fallback(){var r=document.createRange();r.selectNodeContents(t);var s=getSelection();s.removeAllRanges();s.addRange(r)}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback)}else{fallback()}
    });
  });
  apply(start);
})();
