 idee_p1:"Wer im Kunstunterricht etwas erklärt, zeigt: auf ein Detail, auf das Blatt, auf den eigenen Körper. Wer eine Technik vermittelt, führt sie vor. Wer Material erkundet, denkt mit den Händen. Die Forschung zu <em>embodied learning</em> hat diese Einsicht für Tanz, Musik und Theater, für die Museumspädagogik und für das Zeichnen kleiner Kinder ausgearbeitet. Für den schulischen Unterricht in bildender Kunst fehlen empirische, videobasierte Studien fast vollständig.",

(function(){
  var cur='de';
  function apply(l){
    cur=l;var d=T[l];
    document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n');if(k in d)el.innerHTML=d[k]});
    document.documentElement.lang=l;
    document.querySelectorAll('.langs button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===l))});
    try{localStorage.setItem('eliva-lang',l)}catch(e){}
    mark();
  }
  document.querySelectorAll('.langs button').forEach(function(b){b.addEventListener('click',function(){apply(b.dataset.lang)})});
  var start='de';
  try{var saved=localStorage.getItem('eliva-lang');if(saved&&T[saved])start=saved;else{var nav=(navigator.language||'').slice(0,2);if(T[nav])start=nav}}catch(e){}

  var links=[].slice.call(document.querySelectorAll('nav.side a'));
  var secs=links.map(function(a){return document.querySelector(a.getAttribute('href'))}).filter(Boolean);
  function mark(){
    var y=window.scrollY+140,c=secs[0];
    secs.forEach(function(s){if(s.offsetTop<=y)c=s});
    links.forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+c.id)});
  }
  window.addEventListener('scroll',mark,{passive:true});
  document.querySelectorAll('.copy').forEach(function(b){
    b.addEventListener('click',function(){
      var t=document.querySelector(b.dataset.copy),txt=t.textContent;
      function done(){b.textContent=T[cur].copied;setTimeout(function(){b.textContent=T[cur].copy},1500)}
      function fallback(){var r=document.createRange();r.selectNodeContents(t);var s=getSelection();s.removeAllRanges();s.addRange(r)}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback)}else{fallback()}
    });
  });
  apply(start);
})();
